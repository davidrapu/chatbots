services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: 'vector db'
    ports:
      # 5433 on this machine: a Windows-installed Postgres already uses 5432
      - '5433:5432'
    volumes:
      # Keeps the data when the container is removed (Postgres 18 images mount here)
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
