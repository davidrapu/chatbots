name: chatbot
services:

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: 'vector db'
    ports:
      # 5433 on this machine: a Windows-installed Postgres already uses 5432
      - '5433:5432'
    volumes:
      # Keeps the data when the container is removed (Postgres 18 images mount here)
      - pgdata:/var/lib/postgresql
      - ./chatbot/rag/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  backend:
    build: ./chatbot
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
    ports:
      - '8000:8000'
    depends_on:
      - db
  frontend:
    build: 
      context: ./frontend
      args:
        VITE_CHATBOT_API: http://localhost:8000
    ports:
      - '8080:80'
    depends_on:
      - backend
volumes:
  pgdata:
